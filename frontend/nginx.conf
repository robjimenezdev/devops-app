server {
    listen 80;
    server_name _;

    # Carpeta raíz donde están los estáticos
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip — reduce el tamaño de respuesta
    gzip on;
    gzip_types text/html text/css application/javascript;

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Servir el HTML estático
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos (css, js, imágenes)
    location ~* \.(js|css|png|jpg|ico|svg)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Ocultar versión de Nginx por seguridad
    server_tokens off;
}
