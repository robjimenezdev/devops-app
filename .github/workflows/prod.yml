# ============================================================
# Workflow — PROD
# Se dispara en cada push a main
# REQUIERE APROBACIÓN MANUAL antes de desplegar
# La aprobación se configura en GitHub → Environments → prod
# ============================================================
name: Deploy PROD

on:
  push:
    branches:
      - main

env:
  IMAGE_BACKEND:  ${{ secrets.DOCKER_USERNAME }}/devops-app-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKER_USERNAME }}/devops-app-frontend
  TAG: stable   # en prod usamos stable, no latest

jobs:

  # ----------------------------------------------------------
  # JOB 1 — Test
  # Máximas validaciones antes de tocar producción
  # ----------------------------------------------------------
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm install

      - name: Comprobar sintaxis del backend
        working-directory: backend
        run: node --check index.js

      - name: Auditoría de seguridad npm
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Validar Helm chart
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint ./helm/devops-app -f ./helm/devops-app/values-prod.yaml

  # ----------------------------------------------------------
  # JOB 2 — Build & Push
  # Tag stable + tag con SHA del commit para trazabilidad
  # ----------------------------------------------------------
  build:
    name: 🐳 Build & Push
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push imagen backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          dockerfile: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ env.TAG }}
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push imagen frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ env.TAG }}
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------
  # JOB 3 — Aprobación manual
  # GitHub pausa aquí y espera que un responsable apruebe
  # Se configura en: GitHub → Settings → Environments → prod
  # Sin aprobación no se despliega nada en producción
  # ----------------------------------------------------------
  approve:
    name: ⏸ Esperando aprobación
    runs-on: ubuntu-latest
    needs: build
    environment: prod   # ← aquí está la magia — prod tiene reviewers configurados

    steps:
      - name: Aprobación recibida
        run: |
          echo "✅ Despliegue en PROD aprobado"
          echo "🔖 SHA: ${{ github.sha }}"
          echo "👤 Aprobado — continuando despliegue..."

  # ----------------------------------------------------------
  # JOB 4 — Deploy
  # Solo se ejecuta DESPUÉS de la aprobación manual
  # ----------------------------------------------------------
  deploy:
    name: 🚀 Deploy PROD
    runs-on: ubuntu-latest
    needs: approve   # ← depende de la aprobación, no del build

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Configurar kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Crear namespace si no existe
        run: |
          kubectl create namespace prod --dry-run=client -o yaml | kubectl apply -f -

      # En prod hacemos backup antes de desplegar
      - name: Backup BD antes del despliegue
        run: |
          echo "💾 Iniciando backup de PostgreSQL..."
          kubectl exec -n prod \
            $(kubectl get pod -n prod -l app.kubernetes.io/component=database -o jsonpath='{.items[0].metadata.name}') \
            -- pg_dump -U ${{ secrets.DB_USER }} contactsdb > backup-$(date +%Y%m%d-%H%M%S).sql
          echo "✅ Backup completado"
        continue-on-error: true   # si falla el backup no bloqueamos el despliegue

      - name: Deploy con Helm
        run: |
          helm upgrade --install devops-app ./helm/devops-app \
            --namespace prod \
            --values ./helm/devops-app/values-prod.yaml \
            --set backend.image.tag=${{ env.TAG }} \
            --set frontend.image.tag=${{ env.TAG }} \
            --set secret.dbUser=${{ secrets.DB_USER }} \
            --set secret.dbPassword=${{ secrets.DB_PASSWORD }} \
            --wait \
            --timeout 10m \
            --atomic   # si algo falla hace rollback automático

      - name: Verificar despliegue
        run: |
          kubectl rollout status deployment/devops-app-devops-app-backend -n prod
          kubectl rollout status deployment/devops-app-devops-app-frontend -n prod
          kubectl rollout status deployment/devops-app-devops-app-db -n prod

      - name: Smoke test producción
        run: |
          echo "⏳ Verificando que prod responde..."
          sleep 20
          kubectl get ingress -n prod
          kubectl get pods -n prod

      - name: Resumen del despliegue
        run: |
          echo "🎉 PRODUCCIÓN ACTUALIZADA"
          echo "📦 Backend:  ${{ env.IMAGE_BACKEND }}:${{ env.TAG }}"
          echo "📦 Frontend: ${{ env.IMAGE_FRONTEND }}:${{ env.TAG }}"
          echo "🔖 SHA:      ${{ github.sha }}"
          kubectl get pods -n prod
