# ============================================================
# Workflow — STAGING
# Se dispara en cada push a la rama staging
# Muy similar a dev pero con más validaciones
# Simula producción antes de llegar a main
# ============================================================
name: Deploy STAGING

on:
  push:
    branches:
      - staging

env:
  IMAGE_BACKEND:  ${{ secrets.DOCKER_USERNAME }}/devops-app-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKER_USERNAME }}/devops-app-frontend
  TAG: staging

jobs:

  # ----------------------------------------------------------
  # JOB 1 — Test
  # Igual que dev pero añadimos auditoría de seguridad
  # ----------------------------------------------------------
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm install

      - name: Comprobar sintaxis del backend
        working-directory: backend
        run: node --check index.js

      # En staging auditamos vulnerabilidades de dependencias
      - name: Auditoría de seguridad npm
        working-directory: backend
        run: npm audit --audit-level=high
        continue-on-error: false   # si hay vulnerabilidades altas → falla el pipeline

      - name: Validar Helm chart
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint ./helm/devops-app -f ./helm/devops-app/values-staging.yaml

  # ----------------------------------------------------------
  # JOB 2 — Build & Push
  # Igual que dev pero con tag staging
  # ----------------------------------------------------------
  build:
    name: 🐳 Build & Push
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push imagen backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          dockerfile: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ env.TAG }}
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push imagen frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ env.TAG }}
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------
  # JOB 3 — Deploy
  # ----------------------------------------------------------
  deploy:
    name: 🚀 Deploy STAGING
    runs-on: ubuntu-latest
    needs: build
    environment: staging

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Configurar kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Crear namespace si no existe
        run: |
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy con Helm
        run: |
          helm upgrade --install devops-app ./helm/devops-app \
            --namespace staging \
            --values ./helm/devops-app/values-staging.yaml \
            --set backend.image.tag=${{ env.TAG }} \
            --set frontend.image.tag=${{ env.TAG }} \
            --set secret.dbUser=${{ secrets.DB_USER }} \
            --set secret.dbPassword=${{ secrets.DB_PASSWORD }} \
            --wait \
            --timeout 5m

      - name: Verificar despliegue
        run: |
          kubectl rollout status deployment/devops-app-devops-app-backend -n staging
          kubectl rollout status deployment/devops-app-devops-app-frontend -n staging
          kubectl rollout status deployment/devops-app-devops-app-db -n staging

      # En staging hacemos smoke test — comprobamos que la app responde
      - name: Smoke test
        run: |
          echo "⏳ Esperando que el Ingress esté listo..."
          sleep 15
          kubectl get ingress -n staging
          echo "✅ Smoke test completado"

      - name: Resumen del despliegue
        run: |
          echo "✅ Desplegado en STAGING"
          echo "📦 Backend:  ${{ env.IMAGE_BACKEND }}:${{ env.TAG }}"
          echo "📦 Frontend: ${{ env.IMAGE_FRONTEND }}:${{ env.TAG }}"
          echo "🔖 SHA:      ${{ github.sha }}"
          kubectl get pods -n staging
