# ============================================================
# Workflow — DEV
# Se dispara en cada push a la rama develop
# Despliega automáticamente en el namespace dev
# ============================================================
name: Deploy DEV

on:
  push:
    branches:
      - develop

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_BACKEND:  ${{ secrets.DOCKER_USERNAME }}/devops-app-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKER_USERNAME }}/devops-app-frontend
  TAG: dev  # tag fijo para el entorno dev

jobs:

  # ----------------------------------------------------------
  # JOB 1 — Test
  # Comprobaciones básicas antes de construir nada
  # ----------------------------------------------------------
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm install

      - name: Comprobar sintaxis del backend
        working-directory: backend
        run: node --check index.js

      - name: Validar Helm chart
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint ./helm/devops-app -f ./helm/devops-app/values-dev.yaml

  # ----------------------------------------------------------
  # JOB 2 — Build & Push
  # Construye las imágenes Docker y las sube a Docker Hub
  # Solo se ejecuta si el job test pasa
  # ----------------------------------------------------------
  build:
    name: 🐳 Build & Push
    runs-on: ubuntu-latest
    needs: test   # depende de que test pase

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push imagen backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          dockerfile: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ env.TAG }}
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha   # cache de GitHub Actions
          cache-to: type=gha,mode=max

      - name: Build & Push imagen frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ env.TAG }}
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------
  # JOB 3 — Deploy
  # Despliega en Kubernetes con Helm
  # Solo se ejecuta si build pasa
  # ----------------------------------------------------------
  deploy:
    name: 🚀 Deploy DEV
    runs-on: ubuntu-latest
    needs: build
    environment: dev   # entorno de GitHub para trazabilidad

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Configurar kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Crear namespace si no existe
        run: |
          kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy con Helm
        run: |
          helm upgrade --install devops-app ./helm/devops-app \
            --namespace dev \
            --values ./helm/devops-app/values-dev.yaml \
            --set backend.image.tag=${{ env.TAG }} \
            --set frontend.image.tag=${{ env.TAG }} \
            --set secret.dbUser=${{ secrets.DB_USER }} \
            --set secret.dbPassword=${{ secrets.DB_PASSWORD }} \
            --wait \
            --timeout 5m

      - name: Verificar despliegue
        run: |
          kubectl rollout status deployment/devops-app-devops-app-backend -n dev
          kubectl rollout status deployment/devops-app-devops-app-frontend -n dev
          kubectl rollout status deployment/devops-app-devops-app-db -n dev

      - name: Resumen del despliegue
        run: |
          echo "✅ Desplegado en DEV"
          echo "📦 Backend:  ${{ env.IMAGE_BACKEND }}:${{ env.TAG }}"
          echo "📦 Frontend: ${{ env.IMAGE_FRONTEND }}:${{ env.TAG }}"
          echo "🔖 SHA:      ${{ github.sha }}"
          kubectl get pods -n dev
