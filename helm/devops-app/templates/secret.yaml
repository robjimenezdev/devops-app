# ============================================================
# Secret — Credenciales sensibles
# Los valores vienen de GitHub Secrets via GitHub Actions
# NUNCA escribas valores reales aquí
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devops-app.secretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
type: Opaque
data:
  # Los valores se pasan con --set desde GitHub Actions:
  # helm upgrade --set secret.dbUser="$DB_USER" ...
  # Helm los codifica automáticamente en base64
  DB_USER:     {{ .Values.secret.dbUser     | b64enc | quote }}
  DB_PASSWORD: {{ .Values.secret.dbPassword | b64enc | quote }}
