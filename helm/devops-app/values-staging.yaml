# ============================================================
# values-staging.yaml — Sobreescribe values.yaml para STAGING
# Se despliega automático en cada push a staging
# ============================================================

global:
  environment: staging

backend:
  replicaCount: 2           # más réplicas que dev
  image:
    tag: staging
  resources:
    requests:
      cpu: 150m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 384Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

frontend:
  replicaCount: 2
  image:
    tag: staging

ingress:
  host: staging.devops-app.local
  tls: false

namespace: staging
